<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PartyPlay – Lokal spielen</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap">
<h1>🎮 PartyPlay <span class="muted">lokal · TV + Handy</span></h1>
<div class="card"><h2>1 · TV-Raum erstellen</h2>
<input id="tvname" placeholder="Name für TV (z.B. Wohnzimmer-TV)" value="TV">
<div class="row"><button class="btn" onclick="create('quiz')">Quiz starten</button><button class="btn" onclick="create('chess')">Schach starten</button><button class="btn" onclick="create('fr')">Farbrausch starten</button></div>
<div class="row"><button class="btn" onclick="create('slf')">Stadt-Land-Fluss</button><button class="btn" onclick="create('bingo')">Bingo</button><button class="btn" onclick="create('vier')">Vier in Reihe</button></div>
<div class="row"><button class="btn" onclick="create('wolf')">Dorf & Wölfe</button></div>
<p class="muted">TV öffnet danach die TV-Ansicht mit Raum-Code. Handys verbinden sich mit demselben Code.</p></div>
<div class="card"><h2>2 · Mit Handy beitreten</h2>
<input id="pname" placeholder="Dein Name">
<input id="pcode" placeholder="Raum-Code (z.B. AB12)" maxlength="4" style="text-transform:uppercase">
<button class="btn" onclick="join()">Beitreten → Controller</button></div>
<div class="card muted">Läuft komplett im privaten Netzwerk. Kein Internet nötig (außer Installation). Web-UI: <span id="here"></span><br>TV: <code>/tv?room=CODE</code> · Handy: <code>/play?room=CODE</code></div>
</div><script src="/socket.io/socket.io.js"></script><script>
document.getElementById('here').textContent = location.origin;
const io_ = io();
function create(game){ const name=document.getElementById('tvname').value||'TV';
 io_.emit('create-room',{name,game},r=>{ if(r.ok) location.href='/tv?room='+r.code; else alert(r.err); }); }
function join(){ const code=document.getElementById('pcode').value.trim().toUpperCase();
 const name=document.getElementById('pname').value||'Spieler';
 if(code.length!==4) return alert('4-stelligen Code eingeben');
 location.href='/play?room='+code+'&name='+encodeURIComponent(name); }
</script></body></html>
